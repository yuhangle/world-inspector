[package]
name = "world-inspector"
version = "0.1.0"
edition = "2021"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true

[lib]
name = "world_inspector"
crate-type = ["staticlib", "lib"]

[[bin]]
name = "world-inspector"
path = "src/main.rs"

[dependencies]
rusty-leveldb = { git = "https://github.com/yuhangle/leveldb-rs.git" }
bedrock-nbt = { git = "https://github.com/yuhangle/bedrock-protocol-rs.git" }
miniz_oxide = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
